name: HMR Multi-Platform

on:
  pull_request:
    paths:
      - src/**
      - build/**
      - scripts/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - patches/**
      - vite.config.ts
      - eslint.config.mjs
      - tsconfig.json
      - .github/workflows/hmr-multi-platform.yml
  push:
    branches:
      - main
    paths:
      - src/**
      - build/**
      - scripts/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - patches/**
      - vite.config.ts
      - eslint.config.mjs
      - tsconfig.json
      - .github/workflows/hmr-multi-platform.yml
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: h5
            script: build:h5
          - target: app
            script: build:app
          - target: mp-weixin
            script: build:mp-weixin
          - target: mp-alipay
            script: build:mp-alipay
          - target: mp-toutiao
            script: build:mp-toutiao

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: matrix.target == 'h5'
        run: pnpm lint

      - name: Build
        run: pnpm run ${{ matrix.script }}

  hmr:
    name: HMR mp-weixin
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Tailwind artifact HMR smoke
        run: pnpm run test:hmr:artifact:mp-weixin -- --timeout 240000
