packages:
  - packages/*

allowBuilds:
  '@dcloudio/hbuilderx-cli': false
  '@parcel/watcher': true
  '@weapp-tailwindcss/merge': true
  core-js: true
  core-js-pure: true
  esbuild: true
  msgpackr-extract: false
  vue-demi: true
  workerd: true
minimumReleaseAge: 0
overrides:
  '@intlify/core-base': 9.14.5
  '@intlify/message-resolver': 9.1.11
  # oxfmt pins an affected tinypool patch; keep its worker API on the same minor.
  oxfmt>tinypool: 2.1.2
versioning:
  fixed:
    - - create-uni-app-tailwindcss
  ignore:
    - uni-app-tailwindcss-template-default
  changelog:
    storage: repository
