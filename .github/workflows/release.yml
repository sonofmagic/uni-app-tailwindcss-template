# repoctl-managed: release/v2
name: Release

on:
  push:
    branches:
      - main
      - alpha
      - beta
      - rc
      - next
  workflow_dispatch:
    inputs:
      mode:
        description: Release operation
        required: true
        default: auto
        type: choice
        options:
          - auto
          - prepare
          - publish
          - publish-unpublished
      package:
        description: Package used for unpublished-version recovery
        required: false
        type: string
      version:
        description: Version used for unpublished-version recovery
        required: false
        type: string
      source_sha:
        description: Source commit used to recover a prepared release
        required: false
        type: string

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
  HUSKY: 0
  NPM_CONFIG_PROVENANCE: true
  npm_config_registry: https://registry.npmjs.org

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        env:
          REPO_RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          current_playwright=$(node -p "require('./package.json').devDependencies.playwright.replace(/^[^0-9]*/, '')")
          timeout 8m pnpm exec playwright install chromium
          if [[ -n "${REPO_RELEASE_SOURCE_SHA:-}" ]]; then
            source_playwright=$(git show "$REPO_RELEASE_SOURCE_SHA:package.json" | node -e "const fs=require('node:fs'); const pkg=JSON.parse(fs.readFileSync(0, 'utf8')); process.stdout.write((pkg.devDependencies.playwright || '').replace(/^[^0-9]*/, ''))")
            if [[ -n "$source_playwright" && "$source_playwright" != "$current_playwright" ]]; then
              timeout 8m pnpm dlx "playwright@$source_playwright" install chromium
            fi
          fi

      - name: Run repo release CI
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO_RELEASE_MODE: ${{ inputs.mode || 'auto' }}
          REPO_RELEASE_PACKAGE: ${{ inputs.package }}
          REPO_RELEASE_VERSION: ${{ inputs.version }}
          REPO_RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          release_args=(release ci --mode "${REPO_RELEASE_MODE:-auto}")
          if [[ -n "${REPO_RELEASE_PACKAGE:-}" ]]; then release_args+=(--package "$REPO_RELEASE_PACKAGE"); fi
          if [[ -n "${REPO_RELEASE_VERSION:-}" ]]; then release_args+=(--version "$REPO_RELEASE_VERSION"); fi
          if [[ -n "${REPO_RELEASE_SOURCE_SHA:-}" ]]; then release_args+=(--source-sha "$REPO_RELEASE_SOURCE_SHA"); fi
          pnpm exec repo "${release_args[@]}"
