name: HMR Multi-Platform

on:
  pull_request:
    paths:
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - scripts/**
      - templates.json
      - patches/**
      - tsconfig.json
      - .github/workflows/hmr-multi-platform.yml
  push:
    branches:
      - main
    paths:
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - scripts/**
      - templates.json
      - patches/**
      - tsconfig.json
      - .github/workflows/hmr-multi-platform.yml
  workflow_dispatch:

jobs:
  templates:
    name: Resolve templates
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.matrix.outputs.build }}
      hmr: ${{ steps.matrix.outputs.hmr }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build matrices
        id: matrix
        run: |
          matrix=$(node scripts/ci-matrix.mjs)
          echo "build=$(node -e 'const data=JSON.parse(process.argv[1]); console.log(JSON.stringify(data.build))' "$matrix")" >> "$GITHUB_OUTPUT"
          echo "hmr=$(node -e 'const data=JSON.parse(process.argv[1]); console.log(JSON.stringify(data.hmr))' "$matrix")" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.template }} / ${{ matrix.target }}
    needs: templates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.templates.outputs.build) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: matrix.target == 'h5'
        run: pnpm template ${{ matrix.template }} lint

      - name: Build
        run: pnpm template ${{ matrix.template }} ${{ matrix.script }}

      - name: Sync Workers asset output
        if: matrix.isDefault && matrix.target == 'h5'
        run: node scripts/sync-h5-output.mjs ${{ matrix.template }}

      - name: Verify Workers asset output
        if: matrix.isDefault && matrix.target == 'h5'
        run: test -f dist/build/h5/index.html

      - name: Validate Workers deployment
        if: matrix.isDefault && matrix.target == 'h5'
        run: pnpm workers:check

      - name: Install Playwright browser
        if: matrix.isDefault && matrix.target == 'h5'
        run: pnpm --dir packages/create-uni-app-tailwindcss exec playwright install --with-deps chromium

      - name: Create CLI E2E
        if: matrix.isDefault && matrix.target == 'h5'
        run: pnpm test:e2e

  hmr:
    name: HMR ${{ matrix.template }} / ${{ matrix.target }}
    needs: templates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.templates.outputs.hmr) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Tailwind artifact HMR smoke
        run: pnpm template ${{ matrix.template }} ${{ matrix.script }} -- --timeout 240000
