name: HMR Multi-Platform

on:
  pull_request:
    paths:
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - patches/**
      - tsconfig.json
      - .github/workflows/hmr-multi-platform.yml
  push:
    branches:
      - main
    paths:
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - patches/**
      - tsconfig.json
      - .github/workflows/hmr-multi-platform.yml
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: h5
            script: build:h5
          - target: app
            script: build:app
          - target: mp-weixin
            script: build:mp-weixin
          - target: mp-alipay
            script: build:mp-alipay
          - target: mp-toutiao
            script: build:mp-toutiao

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: matrix.target == 'h5'
        run: pnpm lint

      - name: Build
        run: pnpm run ${{ matrix.script }}

      - name: Verify Pages output
        if: matrix.target == 'h5'
        run: test -f dist/build/h5/index.html

      - name: Install Playwright browser
        if: matrix.target == 'h5'
        run: pnpm --dir packages/create-uni-app-tailwindcss exec playwright install --with-deps chromium

      - name: Create CLI E2E
        if: matrix.target == 'h5'
        run: pnpm test:e2e

  hmr:
    name: HMR mp-weixin
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Iconify content HMR smoke
        run: pnpm run test:hmr:mp-weixin -- --timeout 240000
